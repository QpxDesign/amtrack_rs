[package]
name = "amtrack_rs"
version = "0.1.1"
edition = "2021"
readme = "README.md"
license = "MIT"
repository = "https://github.com/qpxdesign/amtrack_rs/"
authors = ["Quinn Patwardhan <qroshan5@gmail.com>"]
description = "A fully open-source Rust-based API and Package for fetching live train and station data from Amtrak."

[dependencies]
amtk = "=0.1.0"
chrono = "0.4.38"
chrono-tz = "0.10.0"
reqwest = "0.12.8"
serde = "1.0.210"
serde_json = "1.0.128"
tokio = { version = "1", features = ["full"] }
rocket = "0.5.1"
uuid = { version = "1", features = ["v4"] }
lazy_static = "1.5.0"
redis = "0.27.3"
